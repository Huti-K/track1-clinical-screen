packages:
  - apps/*
  - packages/*

# Only versions published at least a week ago (minutes).
minimumReleaseAge: 10080

# esbuild fetches its binary; the others' scripts are checks that nothing here needs.
allowBuilds:
  esbuild: true
  "@google/genai": false
  protobufjs: false

# GPT-6.1 Terra shipped after pi-ai 1.4.0's catalog; drop when its catalog carries it.
patchedDependencies:
  "@earendil-works/pi-ai@1.4.0": patches/@earendil-works__pi-ai@1.4.0.patch
